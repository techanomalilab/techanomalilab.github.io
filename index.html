<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Double Roulette</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- Rotate overlay styles -->
    <style>
      #rotateOverlay {
        position: fixed; inset: 0;
        display: none; align-items: center; justify-content: center;
        background: rgba(0,0,0,.75); color: #fff;
        z-index: 9999; text-align: center; padding: 24px;
        font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #rotateOverlay.show { display: flex; }
      #rotateOverlay button {
        margin-top: 12px; padding: 10px 14px; border: 0; border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop" style="display:none">
      <canvas id="unity-canvas" width=900 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar" style="display:none">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Double Roulette</div>
      </div>
    </div>

    <!-- Portrait overlay -->
    <div id="rotateOverlay" aria-hidden="true" role="dialog">
      <div>
        <p>Rotate your device<br>to play in landscape.</p>
      </div>
    </div>

    <script>
      // --- Keep your original refs
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // --- Your build config (unchanged)
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/0.0.9a.loader.js";
      var config = {
        dataUrl: buildUrl + "/0.0.9a.data",
        frameworkUrl: buildUrl + "/0.0.9a.framework.js",
        codeUrl: buildUrl + "/0.0.9a.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Double Roulette",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // --- Mobile vs desktop classes (unchanged)
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        // config.devicePixelRatio = 1; // optional
      } else {
		// Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
		canvas.style.width = "100%";
		canvas.style.height = "100%";
      }

      // ===== ORIENTATION GATING =====
      const rotateOverlay = document.getElementById('rotateOverlay');
      const startBtn = document.getElementById('startBtn');
      let unityStarted = false;

      function isLandscape() {
        // robust check for iOS/Android
        const mql = window.matchMedia ? window.matchMedia('(orientation: landscape)') : null;
        return (mql ? mql.matches : false) || window.innerWidth > window.innerHeight;
      }

      async function tryLockLandscape() {
        // Best-effort: some browsers allow lock only after user gesture + fullscreen
        try {
          if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
          }
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape');
          }
        } catch (e) {
          // iOS Safari commonly throws; we just fall back to waiting for manual rotate.
          console.debug('Orientation lock not available:', e);
        } finally {
          updateForOrientation();
        }
      }

      function updateForOrientation() {
        const landscape = isLandscape();
        // Show overlay in portrait; reveal Unity container only in landscape
        rotateOverlay.classList.toggle('show', !landscape);
        container.style.display = landscape ? 'block' : 'none';

        // Only start Unity once, and only in landscape
        if (landscape && !unityStarted) {
          startUnity();
        }
      }

      function startUnity() {
        unityStarted = true;

        // Now that we are in landscape, show the loading bar and load the engine
        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = (100 * progress) + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => { unityInstance.SetFullscreen(1); };
          }).catch((message) => {
            alert(message);
          });
        };
        document.body.appendChild(script);
      }

      // Keep overlay and start logic in sync with device changes
      window.addEventListener('resize', updateForOrientation);
      window.addEventListener('orientationchange', updateForOrientation);

      // First user gesture: try to lock to landscape (helps on Android/Chrome)
      window.addEventListener('pointerdown', () => {
        if (!unityStarted && !isLandscape()) {
          tryLockLandscape();
        }
      });

      // Button inside the overlay does the same
      if (startBtn) startBtn.addEventListener('click', tryLockLandscape);

      // Initial sync
      document.addEventListener('DOMContentLoaded', updateForOrientation);
      // ===== /ORIENTATION GATING =====
    </script>
  </body>
</html>
